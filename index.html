<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klaar · Website Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#8C52FD; --purple-light:#f0e9ff;
    --red:#FF6B6B; --teal:#50EBC5; --teal-light:#e6fdf7;
    --ink:#222222; --muted:#6b6577; --line:#e7e3ee;
    --bg:#EBEBEB; --card:#ffffff;
    --good:#0f9d6b; --good-bg:#e6f6ef;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:1180px;margin:0 auto;padding:32px 24px 80px}

  /* Header */
  header{display:flex;align-items:center;justify-content:space-between;
    background:var(--ink);border-radius:16px;padding:18px 26px;margin-bottom:24px;flex-wrap:wrap;gap:12px}
  .header-left{display:flex;align-items:center;gap:12px}
  .logo-mark{width:36px;height:36px;border-radius:9px;background:var(--purple);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff}
  h1{font-size:19px;font-weight:700;letter-spacing:-.02em;color:#fff}
  h1 span{color:var(--purple)}
  .sub{font-size:11.5px;color:#999;margin-top:1px}
  button.run{background:var(--purple);color:#fff;border:0;border-radius:9px;
    padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Poppins',sans-serif;transition:opacity .15s}
  button.run:hover{opacity:.85}
  button.run:disabled{opacity:.4;cursor:default}
  .pdf-btn{background:transparent;color:#fff;border:1.5px solid #555;border-radius:9px;
    padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Poppins',sans-serif;
    transition:all .15s;display:none;align-items:center;gap:6px}
  .pdf-btn:hover{border-color:#fff}
  .pdf-btn.visible{display:flex}

  /* Log */
  .log{font-size:13px;color:var(--muted);margin:0 0 20px;padding:10px 14px;
    background:var(--card);border-radius:10px;border:1px solid var(--line)}
  .log b{color:var(--ink);font-weight:600}

  /* Tabs */
  .tabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}
  .tab{padding:7px 16px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;
    font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted);font-family:'Poppins',sans-serif;transition:all .15s}
  .tab:hover{border-color:var(--purple);color:var(--purple)}
  .tab.active{color:#fff;border-color:transparent}

  .panel{display:none}.panel.active{display:block}

  /* Screenshots */
  .ss-wrap{border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:14px;position:relative}
  .ss-wrap img{width:100%;display:block;height:auto;max-height:none;object-fit:unset}
  .ss-label{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.65);color:#fff;
    font-size:10px;font-weight:700;padding:3px 9px;border-radius:5px;letter-spacing:.05em;text-transform:uppercase}
  .ss-link{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.65);color:#fff;
    font-size:10px;font-weight:600;padding:3px 9px;border-radius:5px;text-decoration:none;transition:background .15s}
  .ss-link:hover{background:var(--purple)}
  .ss-placeholder{height:100px;background:var(--line);display:flex;align-items:center;
    justify-content:center;color:var(--muted);font-size:13px}

  /* Blocks */
  .block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 24px;margin-bottom:14px}
  .block h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:12px;font-weight:700}
  .atf-block{border-top:3px solid var(--teal)}

  /* Rows */
  .row{display:grid;grid-template-columns:160px 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
  .row:first-of-type{border-top:0}
  .row .k{color:var(--muted);font-weight:600;font-size:12px;padding-top:1px}

  /* Verdict */
  .why{margin-top:12px;padding:12px 14px;background:var(--purple-light);border-radius:9px;
    font-size:12.5px;border-left:3px solid var(--purple)}
  .why b{font-weight:700;color:var(--purple)}

  /* Score bars inside block */
  .score-row{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12px}
  .score-label{width:140px;color:var(--muted);font-weight:500;flex-shrink:0}
  .score-bar-bg{flex:1;height:7px;background:var(--line);border-radius:99px;overflow:hidden}
  .score-bar-fill{height:100%;border-radius:99px;transition:width .6s ease}
  .score-num{width:24px;text-align:right;font-weight:700;font-size:11.5px;color:var(--ink)}

  /* Radar / chart area */
  .chart-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:20px 24px;margin-bottom:14px}
  .chart-wrap h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;
    color:var(--muted);margin-bottom:16px;font-weight:700}
  canvas{display:block;max-width:100%}
  .charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  @media(max-width:700px){.charts-grid{grid-template-columns:1fr}}

  /* Reco cards */
  .recos{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:8px}
  .reco{border-radius:14px}
  .reco h4{font-size:11px;font-weight:700;margin-bottom:10px;text-transform:uppercase;letter-spacing:.07em}
  .reco.copy h4{color:var(--good)} .reco.copy{border-top:3px solid var(--good)}
  .reco.avoid h4{color:var(--red)} .reco.avoid{border-top:3px solid var(--red)}
  .reco.fix h4{color:var(--purple)} .reco.fix{border-top:3px solid var(--purple)}
  .reco.diff h4{color:#0b7285} .reco.diff{border-top:3px solid var(--teal)}

  .item{font-size:12.5px;padding:9px 0;border-top:1px solid var(--line);line-height:1.5}
  .item:first-of-type{border-top:0}
  .item .meta{font-size:11px;color:var(--muted);margin-top:3px}
  .prio{font-size:9.5px;font-weight:700;text-transform:uppercase;padding:2px 6px;
    border-radius:4px;background:var(--purple-light);color:var(--purple);margin-right:5px}
  .prio.high{background:#ffe4e4;color:#c0392b}
  .prio.medium{background:#fff3e0;color:#b8730a}
  .prio.low{background:var(--purple-light);color:var(--purple)}

  /* Summary */
  .summary{font-size:14px;background:var(--ink);color:#fff;border-radius:14px;
    padding:18px 22px;margin-bottom:18px;line-height:1.65}
  .summary-label{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--teal);margin-bottom:6px}

  .section-title{font-size:14px;font-weight:700;margin:28px 0 12px;color:var(--ink);
    display:flex;align-items:center;gap:10px}
  .section-title::after{content:'';flex:1;height:1px;background:var(--line)}

  .empty{color:var(--muted);font-size:14px;padding:60px 0;text-align:center}

  /* Overview grid */
  .overview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px}
  .ov-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .ov-card .ov-name{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .ov-card .ov-score{font-size:26px;font-weight:700;color:var(--ink)}
  .ov-card .ov-sub{font-size:10.5px;color:var(--muted);margin-top:2px}
  .ov-card .ov-bar{height:4px;border-radius:99px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-left">
      <div class="logo-mark">K</div>
      <div>
        <h1>Klaar <span>· Website Intelligence</span></h1>
        <div class="sub">Module B teardown of klaarhq.com against the field</div>
      </div>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <button class="pdf-btn" id="pdfBtn" onclick="window.print()">⬇ Download PDF</button>
      <button class="run" id="run">Run teardown</button>
    </div>
  </header>

  <div class="log" id="log">Press run to scrape the competitor sites and build the teardown.</div>

  <div id="output">
    <div class="empty" id="empty">No teardown yet.</div>
    <div id="overview-wrap"></div>
    <div class="tabs" id="tabs"></div>
    <div id="panels"></div>
    <div id="reco-wrap"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
const COLORS = {};
{% for k,v in competitors.items() %}COLORS["{{k}}"]="{{v.color}}";{% endfor %}

const log = document.getElementById('log');
const tabs = document.getElementById('tabs');
const panels = document.getElementById('panels');
const recoWrap = document.getElementById('reco-wrap');
const overviewWrap = document.getElementById('overview-wrap');
const empty = document.getElementById('empty');
const runBtn = document.getElementById('run');

const allTeardowns = [];
let radarChart = null;
const sectionCharts = {};

function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function row(k,val){if(!val)return'';return `<div class="row"><div class="k">${k}</div><div>${esc(val)}</div></div>`;}

function avgScore(d){
  const s = d.scores;
  if(!s) return 0;
  const vals = Object.values(s).filter(v=>typeof v==='number');
  return vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : 0;
}

function scoreBar(label, val, color){
  const pct = Math.round((val/10)*100);
  return `<div class="score-row">
    <div class="score-label">${label}</div>
    <div class="score-bar-bg"><div class="score-bar-fill" style="width:${pct}%;background:${color}"></div></div>
    <div class="score-num">${val}</div>
  </div>`;
}

function sectionBlock(title, obj, fields, extraClass){
  if(!obj) return '';
  let rows = fields.map(([key,label])=>row(label, obj[key])).join('');
  let why = obj.why ? `<div class="why"><b>Verdict:</b> ${esc(obj.why)}</div>` : '';
  return `<div class="block ${extraClass||''}"><h3>${title}</h3>${rows}${why}</div>`;
}

function renderScoreCards(){
  if(allTeardowns.length === 0) return;
  let cards = allTeardowns.map(d=>{
    const avg = avgScore(d);
    return `<div class="ov-card" onclick="selectTab('${d.key}')">
      <div class="ov-name">${esc(d.name)}</div>
      <div class="ov-score" style="color:${d.color}">${avg}<span style="font-size:13px;color:var(--muted)">/10</span></div>
      <div class="ov-sub">overall score</div>
      <div class="ov-bar" style="background:${d.color}"></div>
    </div>`;
  }).join('');

  const grid = overviewWrap.querySelector('.overview-grid');
  if(grid){ grid.innerHTML = cards; return; }

  overviewWrap.innerHTML = `
    <div class="section-title">Competitor Overview</div>
    <div class="overview-grid">${cards}</div>
    <div class="chart-wrap"><h3>Website Strength by Category</h3><canvas id="radarChart" height="300"></canvas></div>
    <div class="section-title">Section-by-Section Comparison</div>
    <div class="charts-grid" id="sectionCharts"></div>`;

  // Build the section chart canvases once
  const sc = document.getElementById('sectionCharts');
  sc.innerHTML = SECTION_KEYS.map(s=>
    `<div class="chart-wrap"><h3>${s.label}</h3><canvas id="chart-${s.key}" height="200"></canvas></div>`
  ).join('');
}

const SECTION_KEYS = [
  {key:'above_the_fold', label:'Above the Fold'},
  {key:'structure_layout', label:'B1 · Structure & Layout'},
  {key:'pricing_psychology', label:'B2 · Pricing Psychology'},
  {key:'proof_case_studies', label:'B3 · Proof & Cases'},
  {key:'messaging_conversion', label:'B4 · Messaging'}
];

function renderOverview(){
  renderScoreCards();

  const names = allTeardowns.map(d=>d.name);
  const colors = allTeardowns.map(d=>d.color);

  // Radar chart
  const labels = ['Above the Fold','Structure & Layout','Pricing Psychology','Proof & Cases','Messaging'];
  const keys = ['above_the_fold','structure_layout','pricing_psychology','proof_case_studies','messaging_conversion'];
  const datasets = allTeardowns.map(d=>({
    label: d.name,
    data: keys.map(k=> d.scores && typeof d.scores[k]==='number' ? d.scores[k] : 0),
    borderColor: d.color,
    backgroundColor: d.color + '22',
    pointBackgroundColor: d.color,
    borderWidth: 2,
    pointRadius: 3,
  }));

  if(radarChart){ try{radarChart.destroy();}catch(e){} radarChart=null; }
  const canvas = document.getElementById('radarChart');
  if(canvas){
    radarChart = new Chart(canvas.getContext('2d'), {
      type: 'radar',
      data: {labels, datasets},
      options: {
        responsive: true, maintainAspectRatio: true,
        animation: {duration: 500},
        scales: {r: {min:0, max:10, ticks:{stepSize:2,font:{size:10}}, pointLabels:{font:{size:11,family:'Poppins'}}}},
        plugins: {legend:{labels:{font:{size:11,family:'Poppins'},boxWidth:12}}},
      }
    });
  }

  // Per-section bar charts
  SECTION_KEYS.forEach(({key})=>{
    const data = allTeardowns.map(d=> d.scores && typeof d.scores[key]==='number' ? d.scores[key] : 0);
    const cv = document.getElementById('chart-'+key);
    if(!cv) return;
    if(sectionCharts[key]){ try{sectionCharts[key].destroy();}catch(e){} }
    sectionCharts[key] = new Chart(cv.getContext('2d'), {
      type:'bar',
      data:{ labels: names, datasets:[{ data, backgroundColor: colors.map(c=>c+'bb'), borderColor: colors, borderWidth:2, borderRadius:6 }] },
      options:{
        responsive:true, maintainAspectRatio:true,
        animation:{duration:500},
        plugins:{legend:{display:false}},
        scales:{ y:{min:0,max:10,ticks:{stepSize:2,font:{size:10}},grid:{color:'#f0edf7'}},
                 x:{ticks:{font:{size:10,family:'Poppins'}},grid:{display:false}} }
      }
    });
  });
}


function renderCompetitor(d){
  empty.style.display = 'none';
  allTeardowns.push(d);

  const tab = document.createElement('div');
  tab.className = 'tab'; tab.textContent = d.name; tab.dataset.key = d.key;
  tab.onclick = ()=>selectTab(d.key);
  tabs.appendChild(tab);

  const color = d.color || '#8C52FD';
  const s = d.scores || {};
  const ss = d.screenshots || {};

  function ssBlock(b64, label, url){
    if(!b64) return `<div class="ss-wrap"><div class="ss-placeholder">Screenshot unavailable · <a href="${url}" target="_blank" style="color:var(--purple)">visit page ↗</a></div></div>`;
    return `<div class="ss-wrap"><span class="ss-label">${label}</span><img src="data:image/jpeg;base64,${b64}" alt="${label}"><a class="ss-link" href="${url}" target="_blank">View live ↗</a></div>`;
  }

  const scoreSection = `<div class="block"><h3>Section Scores</h3>
    ${scoreBar('Above the Fold', s.above_the_fold||0, color)}
    ${scoreBar('Structure & Layout', s.structure_layout||0, color)}
    ${scoreBar('Pricing Psychology', s.pricing_psychology||0, color)}
    ${scoreBar('Proof & Cases', s.proof_case_studies||0, color)}
    ${scoreBar('Messaging', s.messaging_conversion||0, color)}
  </div>`;

  const panel = document.createElement('div');
  panel.className = 'panel'; panel.id = 'panel-' + d.key;
  panel.innerHTML =
    scoreSection +
    ssBlock(ss.home, 'HOMEPAGE', d.url) +
    sectionBlock('Above the fold', d.above_the_fold,
      [['headline','Headline'],['subhead','Subhead'],['primary_cta','Primary CTA']], 'atf-block') +
    sectionBlock('B1 · Structure & layout', d.structure_layout,
      [['hierarchy_read','Eye path'],['density','Density']]) +
    ssBlock(ss.pricing, 'PRICING PAGE', d.url+'/pricing') +
    sectionBlock('B2 · Pricing psychology', d.pricing_psychology,
      [['tier_structure','Tiers'],['anchoring','Anchoring'],['most_popular_nudge','Most-popular nudge'],
       ['hidden_behind_contact_sales','Behind contact sales'],['annual_vs_monthly','Annual vs monthly'],
       ['feature_gating','Feature gating'],['risk_reducers','Risk reducers']]) +
    ssBlock(ss.proof, 'CUSTOMERS / PROOF PAGE', d.url+'/customers') +
    sectionBlock('B3 · Proof & case studies', d.proof_case_studies,
      [['logo_wall','Logo wall'],['case_study_construction','Case study build'],
       ['placement_sequencing','Placement'],['testimonial_style','Testimonials'],
       ['recency_relevance','Recency']]) +
    sectionBlock('B4 · Messaging & conversion', d.messaging_conversion,
      [['value_proposition','Value prop'],['positioning','Positioning'],
       ['cta_strategy','CTA strategy'],['friction_points','Friction'],
       ['tone_differentiation','Tone']]);
  panels.appendChild(panel);

  // Render charts progressively so they survive if the connection drops mid-stream
  renderOverview();
  if(!document.querySelector('.tab.active')) selectTab(d.key);
}

function selectTab(key){
  document.querySelectorAll('.tab').forEach(t=>{
    const on = t.dataset.key===key;
    t.classList.toggle('active', on);
    t.style.background = on ? (COLORS[key]||'#8C52FD') : '';
  });
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+key));
}

function renderRecos(r){
  const prioCls = p => p==='high'?'high':p==='medium'?'medium':'low';
  const list = (arr,render)=>(arr&&arr.length ? arr.map(render).join('') : '<div class="item" style="color:var(--muted)">None identified.</div>');
  recoWrap.innerHTML =
    (r.executive_summary ? `<div class="summary"><div class="summary-label">Executive Summary</div>${esc(r.executive_summary)}</div>` : '') +
    `<div class="section-title">Recommendations for klaarhq.com</div>
     <div class="recos">
       <div class="reco copy block"><h4>✦ Copy from field</h4>${list(r.recommendations.copy,
         i=>`<div class="item">${esc(i.move)}<div class="meta">from ${esc(i.observed_in)} · ${esc(i.why)}</div></div>`)}</div>
       <div class="reco avoid block"><h4>✕ Avoid</h4>${list(r.recommendations.avoid,
         i=>`<div class="item">${esc(i.pattern)}<div class="meta">${esc(i.why)}</div></div>`)}</div>
       <div class="reco fix block"><h4>⚡ Fix now</h4>${list(r.recommendations.fix,
         i=>`<div class="item"><span class="prio ${prioCls(i.priority)}">${esc(i.priority)}</span>${esc(i.change)}<div class="meta">${esc(i.page)} · ${esc(i.tied_to)}</div></div>`)}</div>
       <div class="reco diff block"><h4>◈ Differentiate</h4>${list(r.recommendations.differentiate,
         i=>`<div class="item">${esc(i.move)}<div class="meta">anchor: ${esc(i.anchor)}</div></div>`)}</div>
     </div>`;
}

runBtn.onclick = ()=>{
  runBtn.disabled = true;
  tabs.innerHTML=''; panels.innerHTML=''; recoWrap.innerHTML='';
  document.getElementById('pdfBtn').classList.remove('visible'); overviewWrap.innerHTML='';
  allTeardowns.length = 0;
  if(radarChart){radarChart.destroy(); radarChart=null;}
  Object.values(sectionCharts).forEach(c=>{try{c.destroy();}catch(e){}});
  Object.keys(sectionCharts).forEach(k=>delete sectionCharts[k]);
  empty.style.display='block'; empty.textContent='Working...';
  const es = new EventSource('/api/scrape-and-analyze');
  es.onmessage = (e)=>{
    const d = JSON.parse(e.data);
    if(d.status==='scraping'||d.status==='analyzing') log.innerHTML='<b>'+esc(d.message)+'</b>';
    else if(d.status==='warn') log.innerHTML='⚠ <b>'+esc(d.message)+'</b>';
    else if(d.status==='competitor_done') renderCompetitor(d.data);
    else if(d.status==='recommendations_done'){ renderRecos(d.data); }
    else if(d.status==='error'){log.innerHTML='<b>Error: '+esc(d.message)+'</b>';es.close();runBtn.disabled=false;}
    else if(d.status==='done'){
      log.innerHTML='<b>Done.</b> Teardown ready.';
      es.close(); runBtn.disabled=false;
      if(allTeardowns.length){ document.getElementById('pdfBtn').classList.add('visible'); }
      setTimeout(()=>{if(!document.querySelector('.tab.active')) empty.textContent='No data returned.';}, 500);
    }
  };
  es.onerror = ()=>{
    // Connection dropped - keep whatever rendered so far
    if(allTeardowns.length){
      log.innerHTML='<b>Done.</b> Teardown ready (some competitors may be missing).';
      document.getElementById('pdfBtn').classList.add('visible');
    } else {
      log.innerHTML='<b>Connection closed.</b>';
    }
    es.close(); runBtn.disabled=false;
  };
};
</script>
</body>
</html>
