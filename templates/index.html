<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klaar · Website Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#8C52FD; --purple-light:#f0e9ff;
    --red:#FF6B6B; --teal:#50EBC5; --teal-light:#e6fdf7;
    --ink:#222222; --muted:#6b6577; --line:#e7e3ee;
    --bg:#EBEBEB; --card:#ffffff;
    --good:#0f9d6b; --good-bg:#e6f6ef;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:1180px;margin:0 auto;padding:32px 24px 80px}

  /* Header */
  header{display:flex;align-items:center;justify-content:space-between;
    background:var(--ink);border-radius:16px;padding:18px 26px;margin-bottom:24px;flex-wrap:wrap;gap:12px}
  .header-left{display:flex;align-items:center;gap:12px}
  .logo-mark{width:36px;height:36px;border-radius:9px;background:var(--purple);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff}
  h1{font-size:19px;font-weight:700;letter-spacing:-.02em;color:#fff}
  h1 span{color:var(--purple)}
  .sub{font-size:11.5px;color:#999;margin-top:1px}
  button.run{background:var(--purple);color:#fff;border:0;border-radius:9px;
    padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Poppins',sans-serif;transition:opacity .15s}
  button.run:hover{opacity:.85}
  button.run:disabled{opacity:.4;cursor:default}

  /* Log */
  .log{font-size:13px;color:var(--muted);margin:0 0 20px;padding:10px 14px;
    background:var(--card);border-radius:10px;border:1px solid var(--line)}
  .log b{color:var(--ink);font-weight:600}

  /* Tabs */
  .tabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}
  .tab{padding:7px 16px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;
    font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted);font-family:'Poppins',sans-serif;transition:all .15s}
  .tab:hover{border-color:var(--purple);color:var(--purple)}
  .tab.active{color:#fff;border-color:transparent}

  .panel{display:none}.panel.active{display:block}

  /* Blocks */
  .block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 24px;margin-bottom:14px}
  .block h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:12px;font-weight:700}
  .atf-block{border-top:3px solid var(--teal)}

  /* Rows */
  .row{display:grid;grid-template-columns:160px 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
  .row:first-of-type{border-top:0}
  .row .k{color:var(--muted);font-weight:600;font-size:12px;padding-top:1px}

  /* Verdict */
  .why{margin-top:12px;padding:12px 14px;background:var(--purple-light);border-radius:9px;
    font-size:12.5px;border-left:3px solid var(--purple)}
  .why b{font-weight:700;color:var(--purple)}

  /* Score bars inside block */
  .score-row{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12px}
  .score-label{width:140px;color:var(--muted);font-weight:500;flex-shrink:0}
  .score-bar-bg{flex:1;height:7px;background:var(--line);border-radius:99px;overflow:hidden}
  .score-bar-fill{height:100%;border-radius:99px;transition:width .6s ease}
  .score-num{width:24px;text-align:right;font-weight:700;font-size:11.5px;color:var(--ink)}

  /* Radar / chart area */
  .chart-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:20px 24px;margin-bottom:14px}
  .chart-wrap h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;
    color:var(--muted);margin-bottom:16px;font-weight:700}
  canvas{display:block;max-width:100%}

  /* Reco cards */
  .recos{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:8px}
  .reco{border-radius:14px}
  .reco h4{font-size:11px;font-weight:700;margin-bottom:10px;text-transform:uppercase;letter-spacing:.07em}
  .reco.copy h4{color:var(--good)} .reco.copy{border-top:3px solid var(--good)}
  .reco.avoid h4{color:var(--red)} .reco.avoid{border-top:3px solid var(--red)}
  .reco.fix h4{color:var(--purple)} .reco.fix{border-top:3px solid var(--purple)}
  .reco.diff h4{color:#0b7285} .reco.diff{border-top:3px solid var(--teal)}

  .item{font-size:12.5px;padding:9px 0;border-top:1px solid var(--line);line-height:1.5}
  .item:first-of-type{border-top:0}
  .item .meta{font-size:11px;color:var(--muted);margin-top:3px}
  .prio{font-size:9.5px;font-weight:700;text-transform:uppercase;padding:2px 6px;
    border-radius:4px;background:var(--purple-light);color:var(--purple);margin-right:5px}
  .prio.high{background:#ffe4e4;color:#c0392b}
  .prio.medium{background:#fff3e0;color:#b8730a}
  .prio.low{background:var(--purple-light);color:var(--purple)}

  /* Summary */
  .summary{font-size:14px;background:var(--ink);color:#fff;border-radius:14px;
    padding:18px 22px;margin-bottom:18px;line-height:1.65}
  .summary-label{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--teal);margin-bottom:6px}

  .section-title{font-size:14px;font-weight:700;margin:28px 0 12px;color:var(--ink);
    display:flex;align-items:center;gap:10px}
  .section-title::after{content:'';flex:1;height:1px;background:var(--line)}

  .empty{color:var(--muted);font-size:14px;padding:60px 0;text-align:center}

  /* Overview grid */
  .overview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px}
  .ov-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .ov-card .ov-name{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .ov-card .ov-score{font-size:26px;font-weight:700;color:var(--ink)}
  .ov-card .ov-sub{font-size:10.5px;color:var(--muted);margin-top:2px}
  .ov-card .ov-bar{height:4px;border-radius:99px;margin-top:8px}
  /* Klaar own-site section */
  .klaar-section{background:var(--ink);border-radius:16px;padding:24px 28px;margin:28px 0 14px}
  .klaar-section-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .klaar-badge{background:var(--purple);color:#fff;font-size:10px;font-weight:700;
    padding:3px 9px;border-radius:5px;letter-spacing:.05em;text-transform:uppercase}
  .klaar-title{font-size:16px;font-weight:700;color:#fff}
  .klaar-subtitle{font-size:12px;color:#aaa;margin-top:2px}
  .klaar-scores{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .klaar-score-card{background:rgba(255,255,255,.07);border-radius:10px;padding:12px 16px;flex:1;min-width:120px}
  .klaar-score-card .ksc-label{font-size:10px;color:#aaa;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
  .klaar-score-card .ksc-val{font-size:22px;font-weight:700;color:#fff}
  .klaar-score-card .ksc-vs{font-size:11px;margin-top:2px}
  .klaar-score-card .ksc-vs.ahead{color:var(--teal)}
  .klaar-score-card .ksc-vs.behind{color:var(--red)}
  .klaar-score-card .ksc-vs.tied{color:#aaa}
  .klaar-gap{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.3);
    border-radius:10px;padding:14px 16px;margin-bottom:12px}
  .klaar-gap-label{font-size:10px;font-weight:700;text-transform:uppercase;
    letter-spacing:.05em;color:var(--red);margin-bottom:4px}
  .klaar-gap-text{font-size:13px;color:#fff;line-height:1.5}
  .klaar-strength{background:rgba(80,235,197,.1);border:1px solid rgba(80,235,197,.3);
    border-radius:10px;padding:14px 16px;margin-bottom:12px}
  .klaar-strength-label{font-size:10px;font-weight:700;text-transform:uppercase;
    letter-spacing:.05em;color:var(--teal);margin-bottom:4px}
  .klaar-strength-text{font-size:13px;color:#fff;line-height:1.5}
  .klaar-vs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
  .klaar-vs-item{background:rgba(255,255,255,.05);border-radius:9px;padding:11px 13px}
  .klaar-vs-label{font-size:10px;font-weight:700;text-transform:uppercase;
    letter-spacing:.05em;color:#aaa;margin-bottom:4px}
  .klaar-vs-text{font-size:12px;color:#ddd;line-height:1.4}
  .klaar-ss-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .klaar-ss-item{border-radius:10px;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.1)}
  .klaar-ss-item img{width:100%;display:block;height:140px;object-fit:cover;object-position:top}
  .klaar-ss-item .ss-label{position:absolute;top:7px;left:7px;background:rgba(0,0,0,.7);
    color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px}
  .klaar-ss-item a{position:absolute;top:7px;right:7px;background:rgba(0,0,0,.7);
    color:#fff;font-size:9px;padding:2px 7px;border-radius:4px;text-decoration:none}

  /* Per-competitor reco block */
  .vs-reco{background:var(--ink);border-radius:14px;padding:20px 24px;margin-top:14px}
  .vs-reco-header{font-size:11px;font-weight:700;text-transform:uppercase;
    letter-spacing:.08em;color:var(--teal);margin-bottom:14px}
  .vs-summary{font-size:13px;color:#ccc;line-height:1.6;margin-bottom:16px;
    padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.08)}
  .vs-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  @media(max-width:600px){.vs-cols{grid-template-columns:1fr}}
  .vs-col h5{font-size:10px;font-weight:700;text-transform:uppercase;
    letter-spacing:.07em;margin-bottom:10px}
  .vs-col.steal h5{color:var(--teal)}
  .vs-col.counter h5{color:var(--red)}
  .vs-item{font-size:12.5px;padding:8px 0;border-top:1px solid rgba(255,255,255,.07);
    color:#ddd;line-height:1.4}
  .vs-item:first-of-type{border-top:0}
  .vs-item .vs-why{font-size:11px;color:#888;margin-top:3px}
  .vs-watch{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.25);
    border-radius:8px;padding:10px 13px;font-size:12.5px;color:#ffb3b3;line-height:1.5}
  .vs-watch-label{font-size:9.5px;font-weight:700;text-transform:uppercase;
    letter-spacing:.06em;color:var(--red);margin-bottom:4px}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-left">
      <div class="logo-mark">K</div>
      <div>
        <h1>Klaar <span>· Website Intelligence</span></h1>
        <div class="sub">Module B teardown of klaarhq.com against the field</div>
      </div>
    </div>
    <button class="run" id="run">Run teardown</button>
  </header>

  <div class="log" id="log">Press run to scrape the competitor sites and build the teardown.</div>

  <div id="output">
    <div class="empty" id="empty">No teardown yet.</div>
    <div id="overview-wrap"></div>
    <div class="tabs" id="tabs"></div>
    <div id="panels"></div>
    <div id="klaar-wrap"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
const COLORS = {};
{% for k,v in competitors.items() %}COLORS["{{k}}"]="{{v.color}}";{% endfor %}

const log = document.getElementById('log');
const tabs = document.getElementById('tabs');
const panels = document.getElementById('panels');
const klaarWrap = document.getElementById('klaar-wrap');
const overviewWrap = document.getElementById('overview-wrap');
const empty = document.getElementById('empty');
const runBtn = document.getElementById('run');

const allTeardowns = [];
let radarChart = null;

function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function row(k,val){if(!val)return'';return `<div class="row"><div class="k">${k}</div><div>${esc(val)}</div></div>`;}

function avgScore(d){
  const s = d.scores;
  if(!s) return 0;
  const vals = Object.values(s).filter(v=>typeof v==='number');
  return vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : 0;
}

function scoreBar(label, val, color){
  const pct = Math.round((val/10)*100);
  return `<div class="score-row">
    <div class="score-label">${label}</div>
    <div class="score-bar-bg"><div class="score-bar-fill" style="width:${pct}%;background:${color}"></div></div>
    <div class="score-num">${val}</div>
  </div>`;
}

function sectionBlock(title, obj, fields, extraClass){
  if(!obj) return '';
  let rows = fields.map(([key,label])=>row(label, obj[key])).join('');
  let why = obj.why ? `<div class="why"><b>Verdict:</b> ${esc(obj.why)}</div>` : '';
  return `<div class="block ${extraClass||''}"><h3>${title}</h3>${rows}${why}</div>`;
}

function renderOverview(){
  if(allTeardowns.length === 0) return;
  // Score cards
  let cards = allTeardowns.map(d=>{
    const avg = avgScore(d);
    const pct = Math.round((avg/10)*100);
    return `<div class="ov-card">
      <div class="ov-name">${esc(d.name)}</div>
      <div class="ov-score" style="color:${d.color}">${avg}<span style="font-size:14px;color:var(--muted)">/10</span></div>
      <div class="ov-sub">overall score</div>
      <div class="ov-bar" style="background:${d.color};opacity:.25;width:100%"></div>
    </div>`;
  }).join('');
  overviewWrap.innerHTML = `<div class="section-title">Competitor Overview</div><div class="overview-grid">${cards}</div>
    <div class="chart-wrap"><h3>Website Strength by Category</h3><canvas id="radarChart" height="320"></canvas></div>`;

  // Radar chart
  const labels = ['Above the Fold','Structure & Layout','Pricing Psychology','Proof & Cases','Messaging'];
  const keys = ['above_the_fold','structure_layout','pricing_psychology','proof_case_studies','messaging_conversion'];
  const datasets = allTeardowns.map(d=>({
    label: d.name,
    data: keys.map(k=> d.scores && typeof d.scores[k]==='number' ? d.scores[k] : 0),
    borderColor: d.color,
    backgroundColor: d.color + '22',
    pointBackgroundColor: d.color,
    borderWidth: 2,
    pointRadius: 3,
  }));

  if(radarChart) radarChart.destroy();
  const ctx = document.getElementById('radarChart').getContext('2d');
  radarChart = new Chart(ctx, {
    type: 'radar',
    data: {labels, datasets},
    options: {
      responsive: true,
      scales: {r: {min:0, max:10, ticks:{stepSize:2,font:{size:10}}, pointLabels:{font:{size:11,family:'Poppins'}}}},
      plugins: {legend:{labels:{font:{size:11,family:'Poppins'},boxWidth:12}}},
    }
  });
}

function renderCompetitor(d){
  empty.style.display = 'none';
  allTeardowns.push(d);

  const tab = document.createElement('div');
  tab.className = 'tab'; tab.textContent = d.name; tab.dataset.key = d.key;
  tab.onclick = ()=>selectTab(d.key);
  tabs.appendChild(tab);

  const color = d.color || '#8C52FD';
  const s = d.scores || {};
  const scoreSection = `<div class="block"><h3>Section Scores</h3>
    ${scoreBar('Above the Fold', s.above_the_fold||0, color)}
    ${scoreBar('Structure & Layout', s.structure_layout||0, color)}
    ${scoreBar('Pricing Psychology', s.pricing_psychology||0, color)}
    ${scoreBar('Proof & Cases', s.proof_case_studies||0, color)}
    ${scoreBar('Messaging', s.messaging_conversion||0, color)}
  </div>`;

  const panel = document.createElement('div');
  panel.className = 'panel'; panel.id = 'panel-' + d.key;
  panel.innerHTML =
    scoreSection +
    sectionBlock('Above the fold', d.above_the_fold,
      [['headline','Headline'],['subhead','Subhead'],['primary_cta','Primary CTA']], 'atf-block') +
    sectionBlock('B1 · Structure & layout', d.structure_layout,
      [['hierarchy_read','Eye path'],['density','Density']]) +
    sectionBlock('B2 · Pricing psychology', d.pricing_psychology,
      [['tier_structure','Tiers'],['anchoring','Anchoring'],['most_popular_nudge','Most-popular nudge'],
       ['hidden_behind_contact_sales','Behind contact sales'],['annual_vs_monthly','Annual vs monthly'],
       ['feature_gating','Feature gating'],['risk_reducers','Risk reducers']]) +
    sectionBlock('B3 · Proof & case studies', d.proof_case_studies,
      [['logo_wall','Logo wall'],['case_study_construction','Case study build'],
       ['placement_sequencing','Placement'],['testimonial_style','Testimonials'],
       ['recency_relevance','Recency']]) +
    sectionBlock('B4 · Messaging & conversion', d.messaging_conversion,
      [['value_proposition','Value prop'],['positioning','Positioning'],
       ['cta_strategy','CTA strategy'],['friction_points','Friction'],
       ['tone_differentiation','Tone']]);
  panels.appendChild(panel);

  renderOverview();
  if(!document.querySelector('.tab.active')) selectTab(d.key);
}

function selectTab(key){
  document.querySelectorAll('.tab').forEach(t=>{
    const on = t.dataset.key===key;
    t.classList.toggle('active', on);
    t.style.background = on ? (COLORS[key]||'#8C52FD') : '';
  });
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+key));
}

// global recos removed - now per-competitor

function renderKlaarSection(d){
  const s = d.scores || {};
  const vf = d.vs_field || {};
  const ss = d.screenshots || {};

  // Competitor averages are embedded in vs_field text - just show the cards
  const scoreKeys = [
    {k:'above_the_fold', l:'Above the Fold'},
    {k:'structure_layout', l:'Structure'},
    {k:'pricing_psychology', l:'Pricing'},
    {k:'proof_case_studies', l:'Proof'},
    {k:'messaging_conversion', l:'Messaging'},
  ];

  // Calculate field averages from allTeardowns
  function fieldAvg(key){
    const vals = allTeardowns.map(t=>t.scores&&typeof t.scores[key]==='number'?t.scores[key]:null).filter(v=>v!==null);
    return vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1) : null;
  }

  const scoreCards = scoreKeys.map(({k,l})=>{
    const val = s[k]||0;
    const avg = fieldAvg(k);
    let vsText = '', vsCls = 'tied';
    if(avg !== null){
      const diff = (val - parseFloat(avg)).toFixed(1);
      if(diff > 0){ vsText = `+${diff} vs field avg`; vsCls = 'ahead'; }
      else if(diff < 0){ vsText = `${diff} vs field avg`; vsCls = 'behind'; }
      else { vsText = `= field avg (${avg})`; vsCls = 'tied'; }
    }
    return `<div class="klaar-score-card">
      <div class="ksc-label">${l}</div>
      <div class="ksc-val">${val}<span style="font-size:13px;color:#aaa">/10</span></div>
      <div class="ksc-vs ${vsCls}">${vsText}</div>
    </div>`;
  }).join('');

  const ssHtml = `<div class="klaar-ss-row">
    ${ss.home?`<div class="klaar-ss-item"><img src="data:image/jpeg;base64,${ss.home}"><span class="ss-label">HOMEPAGE</span><a href="https://www.klaarhq.com" target="_blank">↗</a></div>`:''}
    ${ss.pricing?`<div class="klaar-ss-item"><img src="data:image/jpeg;base64,${ss.pricing}"><span class="ss-label">PRICING</span><a href="https://www.klaarhq.com/pricing" target="_blank">↗</a></div>`:''}
    ${ss.proof?`<div class="klaar-ss-item"><img src="data:image/jpeg;base64,${ss.proof}"><span class="ss-label">PLATFORM</span><a href="https://www.klaarhq.com/platform" target="_blank">↗</a></div>`:''}
  </div>`;

  const vsGrid = [
    {k:'above_the_fold', l:'Above the Fold'},
    {k:'structure_layout', l:'Structure & Layout'},
    {k:'pricing_psychology', l:'Pricing Psychology'},
    {k:'proof_case_studies', l:'Proof & Cases'},
    {k:'messaging_conversion', l:'Messaging'},
  ].map(({k,l})=> vf[k] ? `<div class="klaar-vs-item"><div class="klaar-vs-label">${l}</div><div class="klaar-vs-text">${esc(vf[k])}</div></div>` : '').join('');

  klaarWrap.innerHTML = `
    <div class="klaar-section">
      <div class="klaar-section-header">
        <div class="logo-mark">K</div>
        <div>
          <div class="klaar-title">Klaar · How We Stack Up</div>
          <div class="klaar-subtitle">klaarhq.com scored against the same rubric as every competitor</div>
        </div>
        <span class="klaar-badge">Our Site</span>
      </div>
      ${ssHtml}
      <div class="klaar-scores">${scoreCards}</div>
      ${vf.biggest_gap?`<div class="klaar-gap"><div class="klaar-gap-label">⚠ Biggest Gap to Fix</div><div class="klaar-gap-text">${esc(vf.biggest_gap)}</div></div>`:''}
      ${vf.biggest_strength?`<div class="klaar-strength"><div class="klaar-strength-label">✓ Biggest Strength</div><div class="klaar-strength-text">${esc(vf.biggest_strength)}</div></div>`:''}
      <div class="klaar-vs-grid">${vsGrid}</div>
    </div>`;
}


function renderCompetitorReco(r){
  const panel = document.getElementById('panel-' + r.key);
  if(!panel) return;
  const list = (arr, render) => arr && arr.length ? arr.map(render).join('') : '';
  panel.innerHTML += `
    <div class="vs-reco">
      <div class="vs-reco-header">⚡ Klaar vs ${esc(r.name)} — What to Do</div>
      ${r.vs_summary ? `<div class="vs-summary">${esc(r.vs_summary)}</div>` : ''}
      <div class="vs-cols">
        <div class="vs-col steal">
          <h5>✦ Steal from them</h5>
          ${list(r.steal, i=>`<div class="vs-item">${esc(i.move)}<div class="vs-why">${esc(i.why)}</div></div>`)}
        </div>
        <div class="vs-col counter">
          <h5>⚔ Counter their weakness</h5>
          ${list(r.counter, i=>`<div class="vs-item">${esc(i.their_weakness)}<div class="vs-why">→ ${esc(i.klaar_move)} · ${esc(i.why)}</div></div>`)}
        </div>
      </div>
      ${r.watch_out ? `<div class="vs-watch"><div class="vs-watch-label">⚠ Watch out</div>${esc(r.watch_out)}</div>` : ''}
    </div>`;
}

runBtn.onclick = ()=>{
  runBtn.disabled = true;
  tabs.innerHTML=''; panels.innerHTML=''; klaarWrap.innerHTML=''; overviewWrap.innerHTML='';
  allTeardowns.length = 0;
  if(radarChart){radarChart.destroy(); radarChart=null;}
  empty.style.display='block'; empty.textContent='Working...';
  const es = new EventSource('/api/scrape-and-analyze');
  es.onmessage = (e)=>{
    const d = JSON.parse(e.data);
    if(d.status==='scraping'||d.status==='analyzing') log.innerHTML='<b>'+esc(d.message)+'</b>';
    else if(d.status==='warn') log.innerHTML='⚠ <b>'+esc(d.message)+'</b>';
    else if(d.status==='competitor_done') renderCompetitor(d.data);
    else if(d.status==='competitor_reco_done') renderCompetitorReco(d.data);
    else if(d.status==='klaar_done') renderKlaarSection(d.data);
    else if(d.status==='error'){log.innerHTML='<b>Error: '+esc(d.message)+'</b>';es.close();runBtn.disabled=false;}
    else if(d.status==='done'){
      log.innerHTML='<b>Done.</b> Teardown ready.';
      es.close(); runBtn.disabled=false;
      setTimeout(()=>{if(!document.querySelector('.tab.active')) empty.textContent='No data returned.';}, 500);
    }
  };
  es.onerror = ()=>{log.innerHTML='<b>Connection closed.</b>';es.close();runBtn.disabled=false;};
};
</script>
</body>
</html>
